<!-- Representative Lever (jobs.lever.co) application form. Labels are siblings
     inside `.application-field` (not <label for>), and links use the
     `urls[Network]` name convention — both real Lever patterns. -->
<div class="content">
  <form class="application-form" method="POST">
    <div class="application-field">
      <label class="application-label">Full name<span class="required">✱</span></label>
      <input name="name" type="text" required />
    </div>
    <div class="application-field">
      <label class="application-label">Email<span class="required">✱</span></label>
      <input name="email" type="email" required />
    </div>
    <div class="application-field">
      <label class="application-label">Phone</label>
      <input name="phone" type="text" />
    </div>
    <div class="application-field">
      <label class="application-label">Current company</label>
      <input name="org" type="text" />
    </div>
    <div class="application-field">
      <label class="application-label">Resume/CV<span class="required">✱</span></label>
      <input name="resume" type="file" required />
    </div>
    <ul class="application-additional">
      <li class="application-question">
        <label class="application-label">LinkedIn URL</label>
        <input name="urls[LinkedIn]" type="text" />
      </li>
      <li class="application-question">
        <label class="application-label">GitHub URL</label>
        <input name="urls[GitHub]" type="text" />
      </li>
      <li class="application-question">
        <label class="application-label">Portfolio or personal website</label>
        <input name="urls[Portfolio]" type="text" />
      </li>
    </ul>
    <div class="application-field">
      <label class="application-label">Additional information</label>
      <textarea name="comments"></textarea>
    </div>
    <button type="submit" class="template-btn-submit">Submit application</button>
  </form>
</div>
